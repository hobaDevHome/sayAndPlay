<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Say & Play</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Baloo+2:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0e17;
        --surface: #1a1828;
        --card: #221f35;
        --accent: #f7b731;
        --green: #26de81;
        --red: #fc5c65;
        --blue: #45aaf2;
        --text: #fffffe;
        --muted: #6b6a8a;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(
            1px 1px at 10% 20%,
            rgba(255, 255, 255, 0.4) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 30% 60%,
            rgba(255, 255, 255, 0.3) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 70% 15%,
            rgba(255, 255, 255, 0.4) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 85% 70%,
            rgba(255, 255, 255, 0.2) 0%,
            transparent 100%
          ),
          radial-gradient(
            2px 2px at 55% 45%,
            rgba(247, 183, 49, 0.3) 0%,
            transparent 100%
          );
      }
      .wrap {
        position: relative;
        z-index: 1;
        width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-family: "Baloo 2", cursive;
        font-size: 1.4rem;
        color: var(--accent);
      }
      .score-pill {
        background: var(--card);
        border: 1px solid rgba(247, 183, 49, 0.25);
        border-radius: 99px;
        padding: 6px 16px;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--accent);
      }
      .progress-track {
        width: 100%;
        height: 6px;
        background: var(--card);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #ff9f43);
        border-radius: 99px;
        transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .word-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .word-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--muted);
        transition: all 0.3s;
      }
      .word-dot.current {
        border-color: var(--accent);
        background: var(--accent);
        transform: scale(1.3);
      }
      .word-dot.correct {
        border-color: var(--green);
        background: var(--green);
      }
      .word-dot.wrong {
        border-color: var(--red);
        background: var(--red);
      }

      .card {
        width: 100%;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 28px;
        padding: 36px 32px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 120px;
        background: radial-gradient(
          ellipse,
          rgba(247, 183, 49, 0.08) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .word-area {
        text-align: center;
      }
      .word-label {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 4px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .word-text {
        font-family: "Baloo 2", cursive;
        font-size: 4.5rem;
        font-weight: 800;
        color: var(--text);
        line-height: 1;
        display: inline-block;
        transition: color 0.3s;
      }
      .word-text.correct-flash {
        color: var(--green);
        animation: correct-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .word-text.wrong-flash {
        animation: wrong-shake 0.4s ease;
      }
      @keyframes correct-pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes wrong-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-10px);
        }
        40% {
          transform: translateX(10px);
        }
        60% {
          transform: translateX(-7px);
        }
        80% {
          transform: translateX(5px);
        }
      }

      .attempts-row {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 8px;
      }
      .heart {
        font-size: 1.1rem;
        transition: all 0.3s;
      }
      .heart.lost {
        filter: grayscale(1);
        opacity: 0.3;
        transform: scale(0.8);
      }

      .mic-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .mic-icon {
        font-size: 2.5rem;
        transition: all 0.3s;
      }
      .mic-icon.listening {
        animation: mic-pulse 1.5s ease infinite;
      }
      .mic-icon.processing {
        opacity: 0.5;
      }
      @keyframes mic-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }

      .waveform {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 30px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .waveform.active {
        opacity: 1;
      }
      .wave-bar {
        width: 4px;
        border-radius: 99px;
        background: var(--accent);
        animation: wave-anim 1s ease infinite;
      }
      .wave-bar:nth-child(1) {
        height: 8px;
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        height: 18px;
        animation-delay: 0.1s;
      }
      .wave-bar:nth-child(3) {
        height: 24px;
        animation-delay: 0.2s;
      }
      .wave-bar:nth-child(4) {
        height: 14px;
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(5) {
        height: 20px;
        animation-delay: 0.15s;
      }
      .wave-bar:nth-child(6) {
        height: 10px;
        animation-delay: 0.25s;
      }
      .wave-bar:nth-child(7) {
        height: 16px;
        animation-delay: 0.05s;
      }
      @keyframes wave-anim {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(0.3);
        }
      }

      .mic-status {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        height: 18px;
      }
      .mic-status.active {
        color: var(--accent);
      }
      .mic-status.proc {
        color: var(--blue);
      }

      .feedback {
        width: 100%;
        border-radius: 14px;
        padding: 12px 16px;
        text-align: center;
        font-weight: 800;
        font-size: 0.95rem;
        opacity: 0;
        transition:
          opacity 0.3s,
          transform 0.3s;
        transform: translateY(6px);
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .feedback.show {
        opacity: 1;
        transform: translateY(0);
      }
      .feedback.correct {
        background: rgba(38, 222, 129, 0.12);
        color: var(--green);
        border: 1px solid rgba(38, 222, 129, 0.3);
      }
      .feedback.wrong {
        background: rgba(252, 92, 101, 0.12);
        color: var(--red);
        border: 1px solid rgba(252, 92, 101, 0.3);
      }
      .feedback.reveal {
        background: rgba(69, 170, 242, 0.12);
        color: var(--blue);
        border: 1px solid rgba(69, 170, 242, 0.3);
      }

      .transcript {
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        min-height: 18px;
        font-style: italic;
      }

      .screen {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
        text-align: center;
      }
      .screen-icon {
        font-size: 4rem;
      }
      .screen h2 {
        font-family: "Baloo 2", cursive;
        font-size: 2rem;
        color: var(--accent);
      }
      .screen p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        max-width: 320px;
      }
      .big-score {
        font-family: "Baloo 2", cursive;
        font-size: 3.5rem;
        color: var(--green);
      }
      .btn-start {
        background: var(--accent);
        color: #0f0e17;
        border: none;
        border-radius: 14px;
        padding: 14px 40px;
        font-family: "Nunito", sans-serif;
        font-size: 1.05rem;
        font-weight: 900;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 1px;
      }
      .btn-start:hover {
        transform: scale(1.04);
        box-shadow: 0 8px 30px rgba(247, 183, 49, 0.35);
      }

      .confetti-piece {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -10px;
        border-radius: 2px;
        pointer-events: none;
        z-index: 999;
        animation: cfalli linear forwards;
      }
      @keyframes cfalli {
        to {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="logo">🎮 Say & Play3</div>
        <div class="score-pill" id="scorePill">0 / 0</div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>

      <div class="word-dots" id="wordDots"></div>

      <div class="card">
        <!-- START -->
        <div class="screen" id="startScreen">
          <div class="screen-icon">🎤</div>
          <h2>Say & Play</h2>
          <p>
            انطق كل كلمة بصوت واضح — المايك هيفضل شغال طول اللعبة من غير ما تضغط
            حاجة!
          </p>
          <button class="btn-start" onclick="startGame()">ابدأ اللعبة !</button>
        </div>

        <!-- GAME -->
        <div
          id="gameScreen"
          class="hidden"
          style="
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
          "
        >
          <div class="word-area">
            <div class="word-label">say the word</div>
            <div class="word-text" id="wordText">—</div>
            <div class="attempts-row" id="heartsRow"></div>
          </div>

          <div class="mic-area">
            <div class="mic-icon" id="micIcon">🎤</div>
            <div class="waveform" id="waveform">
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
            </div>
            <div class="mic-status" id="micStatus">استنى...</div>
          </div>

          <div class="feedback" id="feedback"></div>
          <div class="transcript" id="transcript"></div>
        </div>

        <!-- RESULT -->
        <div class="screen hidden" id="resultScreen">
          <div class="screen-icon" id="resultIcon">🏆</div>
          <h2 id="resultTitle">أحسنت!</h2>
          <div class="big-score" id="resultScore">0/0</div>
          <p id="resultMsg"></p>
          <button class="btn-start" onclick="restartGame()">
            العب تاني 🔄
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── CONFIG ──────────────────────────────────────────────
      const WORDS = [
        "Dog",
        "Cat",
        "Sun",
        "Tree",
        "Book",
        "Fish",
        "Bird",
        "Frog",
      ];
      const MAX_ATTEMPTS = 3;

      // silence detection
      const SPEECH_THRESHOLD = 0.025; // rms above → speech
      const SILENCE_THRESHOLD = 0.012; // rms below → silence
      const SILENCE_DURATION = 900; // ms of silence after speech → trigger send
      const MIN_SPEECH_MS = 250; // ignore clips shorter than this
      // ────────────────────────────────────────────────────────

      let currentIndex = 0;
      let correctCount = 0;
      let attemptsDone = 0;
      let wordLocked = false;
      let wordResults = [];
      let isProcessing = false;

      // audio
      let stream = null;
      let audioContext = null;
      let analyser = null;
      let mediaRecorder = null;
      let audioChunks = [];
      let animFrame = null;

      // vad state
      let isSpeaking = false;
      let speechStartTime = 0;
      let silenceStartTime = 0;

      // ── START ──
      async function startGame() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
          alert("محتاجين إذن الميكروفون!");
          return;
        }

        currentIndex = 0;
        correctCount = 0;
        wordResults = Array(WORDS.length).fill(null);

        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        setupAnalyser();
        buildDots();
        loadWord();
        vadLoop();
      }

      // ── AUDIO SETUP ──
      function setupAnalyser() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
      }

      // ── VAD LOOP ──
      function vadLoop() {
        const buf = new Float32Array(analyser.fftSize);

        function tick() {
          animFrame = requestAnimationFrame(tick);
          if (!analyser || wordLocked || isProcessing) return;

          analyser.getFloatTimeDomainData(buf);
          const rms = Math.sqrt(
            buf.reduce((s, v) => s + v * v, 0) / buf.length,
          );

          if (rms > SPEECH_THRESHOLD) {
            // ── speech ──
            silenceStartTime = 0;
            if (!isSpeaking) {
              isSpeaking = true;
              speechStartTime = Date.now();
              beginRecording();
              setUIListening();
            }
          } else if (rms < SILENCE_THRESHOLD && isSpeaking) {
            // ── silence after speech ──
            if (!silenceStartTime) silenceStartTime = Date.now();

            if (Date.now() - silenceStartTime >= SILENCE_DURATION) {
              isSpeaking = false;
              silenceStartTime = 0;
              const spokenMs = Date.now() - speechStartTime;

              if (spokenMs >= MIN_SPEECH_MS) {
                endRecordingAndSend();
              } else {
                cancelRecording();
                setUIReady();
              }
            }
          } else if (rms < SILENCE_THRESHOLD && !isSpeaking) {
            silenceStartTime = 0;
          }
        }
        tick();
      }

      // ── RECORDING ──
      function beginRecording() {
        audioChunks = [];
        // prefer wav-friendly format; fallback to webm
        const mimeType = MediaRecorder.isTypeSupported("audio/mp4")
          ? "audio/mp4"
          : MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : "audio/webm";
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.start();
      }

      function endRecordingAndSend() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;
        isProcessing = true;
        setUIProcessing();
        mediaRecorder.onstop = sendToWhisper;
        mediaRecorder.stop();
      }

      function cancelRecording() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
        audioChunks = [];
      }

      // ── WHISPER → GPT-4o ──
      async function sendToWhisper() {
        const mimeType = mediaRecorder.mimeType || "audio/webm";
        const blob = new Blob(audioChunks, { type: mimeType });
        const base64 = await blobToBase64(blob);

        try {
          const res = await fetch("/api/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              audioBase64: base64,
              mimeType: mimeType,
              targetWord: WORDS[currentIndex],
            }),
          });

          const result = await res.json();
          document.getElementById("transcript").textContent = result.heard
            ? `"${result.heard}"`
            : "";

          isProcessing = false;
          handleResult(result.correct, result.feedback, result.heard || "");
        } catch (err) {
          console.error(err);
          isProcessing = false;
          showFeedback("wrong", "❌ حصل خطأ في الاتصال");
          setUIReady();
        }
      }

      // ── HANDLE RESULT ──
      function handleResult(isCorrect, feedback, heard) {
        if (isCorrect) {
          wordLocked = true;
          correctCount++;
          wordResults[currentIndex] = "correct";
          document.getElementById("wordText").classList.add("correct-flash");
          showFeedback("correct", `✅ ${feedback || "ممتاز! النطق صح"}`);
          setUILocked();
          updateScore();
          updateDots();
          confetti();
          setTimeout(() => {
            currentIndex++;
            loadWord();
          }, 1800);
        } else {
          loseHeart(attemptsDone);
          attemptsDone++;
          document.getElementById("wordText").classList.add("wrong-flash");
          setTimeout(
            () =>
              document
                .getElementById("wordText")
                .classList.remove("wrong-flash"),
            500,
          );

          if (attemptsDone >= MAX_ATTEMPTS) {
            wordLocked = true;
            wordResults[currentIndex] = "wrong";
            updateDots();
            showFeedback("reveal", `🔈 الكلمة الصح: ${WORDS[currentIndex]}`);
            setUILocked();
            const word = WORDS[currentIndex];
            // speak the correct word
            try {
              speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(word);
              u.lang = "en-GB";
              u.rate = 0.75;
              speechSynthesis.speak(u);
            } catch (e) {
              console.warn("Speech synthesis failed", e);
            }
            // advance after fixed delay — don't rely on onend
            setTimeout(() => {
              currentIndex++;
              loadWord();
            }, 2500);
          } else {
            const rem = MAX_ATTEMPTS - attemptsDone;
            showFeedback(
              "wrong",
              `❌ ${feedback || "حاول تاني"} — باقي ${rem} ${rem === 1 ? "محاولة" : "محاولات"}`,
            );
            setUIReady();
          }
        }
      }

      // ── LOAD WORD ──
      function loadWord() {
        if (currentIndex >= WORDS.length) {
          endGame();
          return;
        }

        attemptsDone = 0;
        wordLocked = false;
        isSpeaking = false;
        silenceStartTime = 0;

        document.getElementById("wordText").textContent = WORDS[currentIndex];
        document.getElementById("wordText").className = "word-text";
        document.getElementById("feedback").className = "feedback";
        document.getElementById("feedback").textContent = "";
        document.getElementById("transcript").textContent = "";

        buildHearts();
        updateDots();
        updateProgress();
        updateScore();
        setUIReady();
      }

      // ── UI STATES ──
      function setUIReady() {
        document.getElementById("micIcon").className = "mic-icon listening";
        document.getElementById("micIcon").textContent = "🎤";
        document.getElementById("micStatus").textContent = "بيسمعك...";
        document.getElementById("micStatus").className = "mic-status active";
        document.getElementById("waveform").classList.remove("active");
      }
      function setUIListening() {
        document.getElementById("micIcon").className = "mic-icon listening";
        document.getElementById("micIcon").textContent = "🎙️";
        document.getElementById("micStatus").textContent = "بيسجل...";
        document.getElementById("micStatus").className = "mic-status active";
        document.getElementById("waveform").classList.add("active");
      }
      function setUIProcessing() {
        document.getElementById("micIcon").className = "mic-icon processing";
        document.getElementById("micIcon").textContent = "⏳";
        document.getElementById("micStatus").textContent = "بيحلل...";
        document.getElementById("micStatus").className = "mic-status proc";
        document.getElementById("waveform").classList.remove("active");
      }
      function setUILocked() {
        document.getElementById("micIcon").textContent = "🔒";
        document.getElementById("micIcon").className = "mic-icon";
        document.getElementById("micStatus").textContent = "";
        document.getElementById("waveform").classList.remove("active");
      }

      // ── HELPERS ──
      function buildDots() {
        const el = document.getElementById("wordDots");
        el.innerHTML = "";
        WORDS.forEach((_, i) => {
          const d = document.createElement("div");
          d.className = "word-dot";
          d.id = `dot-${i}`;
          el.appendChild(d);
        });
      }
      function updateDots() {
        WORDS.forEach((_, i) => {
          const d = document.getElementById(`dot-${i}`);
          if (!d) return;
          d.className = "word-dot";
          if (i === currentIndex) d.classList.add("current");
          else if (wordResults[i] === "correct") d.classList.add("correct");
          else if (wordResults[i] === "wrong") d.classList.add("wrong");
        });
      }
      function buildHearts() {
        const row = document.getElementById("heartsRow");
        row.innerHTML = "";
        for (let i = 0; i < MAX_ATTEMPTS; i++) {
          const h = document.createElement("span");
          h.className = "heart";
          h.id = `heart-${i}`;
          h.textContent = "❤️";
          row.appendChild(h);
        }
      }
      function loseHeart(i) {
        const h = document.getElementById(`heart-${i}`);
        if (h) h.classList.add("lost");
      }
      function updateProgress() {
        document.getElementById("progressFill").style.width =
          (currentIndex / WORDS.length) * 100 + "%";
      }
      function updateScore() {
        document.getElementById("scorePill").textContent =
          `${correctCount} / ${WORDS.length}`;
      }
      function showFeedback(type, msg) {
        const el = document.getElementById("feedback");
        el.className = `feedback ${type} show`;
        el.textContent = msg;
      }

      // ── END GAME ──
      function endGame() {
        if (animFrame) cancelAnimationFrame(animFrame);
        if (stream) stream.getTracks().forEach((t) => t.stop());
        if (audioContext) audioContext.close();

        document.getElementById("gameScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.remove("hidden");
        document.getElementById("progressFill").style.width = "100%";

        const ratio = correctCount / WORDS.length;
        document.getElementById("resultScore").textContent =
          `${correctCount} / ${WORDS.length}`;

        if (ratio === 1) {
          document.getElementById("resultIcon").textContent = "🏆";
          document.getElementById("resultTitle").textContent = "مثالي!";
          document.getElementById("resultMsg").textContent =
            "نطقت كل الكلمات صح — أنت نجم!";
          confetti(50);
        } else if (ratio >= 0.6) {
          document.getElementById("resultIcon").textContent = "🌟";
          document.getElementById("resultTitle").textContent = "أحسنت!";
          document.getElementById("resultMsg").textContent =
            "كمان شوية تمرين وهتبقى محترف!";
          confetti(25);
        } else {
          document.getElementById("resultIcon").textContent = "💪";
          document.getElementById("resultTitle").textContent = "حاول تاني!";
          document.getElementById("resultMsg").textContent =
            "مش مشكلة — التمرين يجيب الكمال!";
        }
      }

      // ── RESTART ──
      function restartGame() {
        currentIndex = 0;
        correctCount = 0;
        wordResults = Array(WORDS.length).fill(null);
        document.getElementById("resultScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        buildDots();
        loadWord();
        vadLoop();
      }

      // ── CONFETTI ──
      function confetti(count = 20) {
        const colors = [
          "#f7b731",
          "#26de81",
          "#fc5c65",
          "#45aaf2",
          "#a29bfe",
          "#fd9644",
        ];
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "confetti-piece";
          el.style.left = Math.random() * 100 + "vw";
          el.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          el.style.animationDuration = 1.5 + Math.random() * 2 + "s";
          el.style.animationDelay = Math.random() * 0.4 + "s";
          el.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        }
      }
    </script>
  </body>
</html>
